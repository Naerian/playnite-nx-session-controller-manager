AddonId: ControllerSessionManager_6f3e7a21-98f4-4f2b-92ad-3fc0e6e941dc
Type: Generic
Name: Controller Manager
Author: Narian
ShortDescription: Identify and test game controllers in Playnite, and protect active sessions when a participating pad disconnects.
InstallerManifestUrl: https://raw.githubusercontent.com/Naerian/playnite-nx-session-controller-manager/main/installer.yaml
SourceUrl: https://github.com/Naerian/playnite-nx-session-controller-manager
Description: |
  Controller Manager identifies connected controllers, tests buttons, sticks, rumble, drift and latency inside Playnite, tracks which pads actually participate in a game session and reacts when a participant disconnects. It supports adaptive controller handover and local multiplayer, configurable Fullscreen notifications and an external disconnect overlay, conservative pause policies, custom names and icons, trustworthy battery states, Desktop quick access, theme integration and privacy-conscious support reports.
