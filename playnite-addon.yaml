ShortDescription: Identifies and tracks controllers actively used during a game session, with adaptive switching, tester, connect/disconnect notifications and auto-pause.
InstallerManifestUrl: https://raw.githubusercontent.com/Naerian/playnite-nx-session-controller-manager/main/installer.yaml
SourceUrl: https://github.com/Naerian/playnite-nx-session-controller-manager
Description: |
  Controller Session Manager identifies and tracks controllers actively used during a game session. It provides five core features: adaptive controller switching for local and multiplayer games, gamepad tester, connection notifications, disconnection notifications, and automatic game pausing when a controller disconnects. It is highly customizable, adapting to both desktop and fullscreen modes while supporting battery state displays, custom names, and icons.
